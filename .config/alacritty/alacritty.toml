
[general]
import = [
    "~/.config/alacritty/themes/ubuntu.toml"
]

[window]
padding = { x = 20, y = 20 }
opacity = 0.90 

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "monospace"
style = "Regular"

[shell]
program = "/bin/fish"
args = ["--login"]

