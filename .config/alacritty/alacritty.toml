
[general]
import = [
    "~/.config/alacritty/themes/Cobalt2.toml"
]

[window]
padding = { x = 20, y = 20 }
opacity = 0.98 

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11.0

[selection]
save_to_clipboard = true

# Cobalt2 theme

[colors.primary]
background = '#122637'
foreground = '#ffffff'

[colors.cursor]
text = '#122637'
cursor = '#f0cb09'

# Normal colors
[colors.normal]
black   = '#000000'
red     = '#ff0000'
green   = '#37dd21'
yellow  = '#fee409'
blue    = '#1460d2'
magenta = '#ff005d'
cyan    = '#00bbbb'
white   = '#bbbbbb'

# Bright colors
[colors.bright]
black   = '#545454'
red     = '#f40d17'
green   = '#3bcf1d'
yellow  = '#ecc809'
blue    = '#5555ff'
magenta = '#ff55ff'
cyan    = '#6ae3f9'
white   = '#ffffff'

